[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-platform-reference"
version = "1.0.0"
description = "Video sharing platform reference design and prototype: resumable uploads, object storage, transcoding pipeline, HLS packaging, signed CDN URLs, view counting, engagement"
authors = [{ name = "Shiv Kumar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["video"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true
